<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgMeteor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#150805"/>
      <stop offset="100%" stop-color="#241108"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#bgMeteor)"/>
  
  <!-- Meteorito Pixel cayendo -->
  <g transform="translate(180, 50)">
    <!-- Cola de fuego / Chispas pixeladas -->
    <rect x="200" y="10" width="40" height="20" fill="#ff5555" opacity="0.3"/>
    <rect x="150" y="30" width="50" height="30" fill="#ffaa00" opacity="0.5"/>
    <rect x="100" y="60" width="60" height="40" fill="#ff5555" opacity="0.7"/>
    <rect x="60" y="90" width="70" height="50" fill="#ffaa00"/>
    <!-- Núcleo meteorito -->
    <rect x="20" y="120" width="70" height="60" fill="#1c1917"/>
    <rect x="30" y="130" width="20" height="20" fill="#78350f"/>
    <rect x="55" y="145" width="25" height="25" fill="#f97316"/>
    <rect x="25" y="160" width="15" height="15" fill="#ef4444"/>
    <rect x="0" y="160" width="30" height="30" fill="#ffaa00"/>
  </g>

  <!-- Suelo de impacto -->
  <rect x="0" y="300" width="640" height="60" fill="#1c1917"/>
  <rect x="0" y="295" width="640" height="5" fill="#44403c"/>

  <text x="320" y="260" font-family="'Courier New', monospace" font-weight="900" font-size="20" fill="#ffaa00" text-anchor="middle" letter-spacing="3">
    [ EVENTO: METEORITO DINOSAURIO ]
  </text>
  <text x="320" y="285" font-family="'Courier New', monospace" font-size="13" fill="#fdba74" text-anchor="middle">
    CONDITIONALEVENTS &bull; WORLDGUARD &bull; REACTION SNEAK
  </text>
</svg>
