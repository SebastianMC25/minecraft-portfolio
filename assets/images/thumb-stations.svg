<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgStat" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#120c1a"/>
      <stop offset="100%" stop-color="#241733"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#bgStat)"/>
  
  <!-- Yunque / Mesa de Forja y Gemas Pixel -->
  <g transform="translate(250, 70) scale(3.5)">
    <!-- Base del Yunque -->
    <rect x="8" y="32" width="24" height="6" fill="#374151"/>
    <rect x="14" y="24" width="12" height="8" fill="#4b5563"/>
    <rect x="6" y="16" width="28" height="8" fill="#6b7280"/>
    <rect x="2" y="16" width="6" height="4" fill="#9ca3af"/>
    <!-- Gema brillante flotando sobre el yunque -->
    <polygon points="20,2 26,8 20,14 14,8" fill="#c084fc"/>
    <rect x="18" y="6" width="4" height="4" fill="#f3e8ff"/>
  </g>

  <text x="320" y="275" font-family="'Courier New', monospace" font-weight="900" font-size="18" fill="#c084fc" text-anchor="middle" letter-spacing="3">
    [ ESTACIONES DE FORJA RPG ]
  </text>
  <text x="320" y="300" font-family="'Courier New', monospace" font-size="13" fill="#e9d5ff" text-anchor="middle">
    CORETOOLS &bull; REFORGE &bull; GEMSTONES &bull; TRANSMOG
  </text>
</svg>
