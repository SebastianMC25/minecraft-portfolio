<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgStock" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070c14"/>
      <stop offset="100%" stop-color="#111c2c"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#bgStock)"/>
  
  <!-- Gráfica de Bolsa de Valores Pixel -->
  <g transform="translate(120, 80)">
    <!-- Ejes -->
    <rect x="0" y="0" width="4" height="150" fill="#475569"/>
    <rect x="0" y="150" width="400" height="4" fill="#475569"/>
    
    <!-- Barras de volumen pixel -->
    <rect x="30" y="100" width="16" height="50" fill="#334155"/>
    <rect x="80" y="70" width="16" height="80" fill="#334155"/>
    <rect x="130" y="110" width="16" height="40" fill="#334155"/>
    <rect x="180" y="50" width="16" height="100" fill="#334155"/>
    <rect x="230" y="80" width="16" height="70" fill="#334155"/>
    <rect x="280" y="30" width="16" height="120" fill="#334155"/>
    <rect x="330" y="20" width="16" height="130" fill="#334155"/>

    <!-- Línea de tendencia verde esmeralda ascendente pixelada -->
    <path d="M 38 100 L 88 70 L 138 110 L 188 50 L 238 80 L 288 30 L 338 20" fill="none" stroke="#55ff55" stroke-width="4"/>
    <!-- Puntos de cotización -->
    <rect x="34" y="96" width="8" height="8" fill="#55ffff"/>
    <rect x="84" y="66" width="8" height="8" fill="#55ffff"/>
    <rect x="134" y="106" width="8" height="8" fill="#55ffff"/>
    <rect x="184" y="46" width="8" height="8" fill="#55ffff"/>
    <rect x="234" y="76" width="8" height="8" fill="#55ffff"/>
    <rect x="284" y="26" width="8" height="8" fill="#55ffff"/>
    <rect x="334" y="16" width="8" height="8" fill="#55ffff"/>
  </g>

  <text x="320" y="280" font-family="'Courier New', monospace" font-weight="900" font-size="18" fill="#55ffff" text-anchor="middle" letter-spacing="3">
    [ BOLSA DE VALORES & STOCK DINÁMICO ]
  </text>
  <text x="320" y="305" font-family="'Courier New', monospace" font-size="13" fill="#93c5fd" text-anchor="middle">
    CORETOOLS &bull; OFERTA Y DEMANDA &bull; ECONOMÍA VIVA
  </text>
</svg>
