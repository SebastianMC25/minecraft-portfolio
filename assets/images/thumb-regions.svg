<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgReg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071510"/>
      <stop offset="100%" stop-color="#0f261c"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#bgReg)"/>
  
  <!-- Círculos de radar / regiones pixel -->
  <g transform="translate(320, 140)">
    <rect x="-100" y="-80" width="200" height="160" fill="none" stroke="#55ff55" stroke-width="2" stroke-dasharray="6, 6" opacity="0.4"/>
    <rect x="-60" y="-50" width="120" height="100" fill="none" stroke="#55ff55" stroke-width="2" stroke-dasharray="4, 4" opacity="0.7"/>
    <rect x="-20" y="-15" width="40" height="30" fill="rgba(85, 255, 85, 0.2)" stroke="#55ff55" stroke-width="2"/>
    <!-- Punto central -->
    <rect x="-4" y="-4" width="8" height="8" fill="#55ffff"/>
  </g>

  <text x="320" y="270" font-family="'Courier New', monospace" font-weight="900" font-size="18" fill="#55ff55" text-anchor="middle" letter-spacing="3">
    [ REGIONES & ENTORNO DINÁMICO ]
  </text>
  <text x="320" y="295" font-family="'Courier New', monospace" font-size="13" fill="#86efac" text-anchor="middle">
    CONDITIONALEVENTS &bull; INMERSIÓN &bull; AFK AUTOMATION
  </text>
</svg>
