<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#082f49"/>
      <stop offset="60%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#e0f2fe" stop-opacity="0.6"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#bgSky)"/>

  <!-- Nubes pixeladas en movimiento -->
  <g fill="url(#cloudGrad)">
    <rect x="40" y="70" width="140" height="25" rx="4"/>
    <rect x="70" y="55" width="80" height="20" rx="3"/>
    <rect x="420" y="110" width="180" height="30" rx="5"/>
    <rect x="470" y="95" width="100" height="20" rx="4"/>
    <rect x="180" y="210" width="220" height="35" rx="6"/>
  </g>

  <!-- Corrientes de viento de velocidad aérea -->
  <g stroke="#7dd3fc" stroke-width="3" stroke-dasharray="25 15" opacity="0.6">
    <line x1="20" y1="130" x2="320" y2="130"/>
    <line x1="80" y1="160" x2="450" y2="160"/>
    <line x1="140" y1="185" x2="520" y2="185"/>
  </g>

  <!-- Navegador aéreo central / Vuelo -->
  <g transform="translate(240, 110)">
    <!-- Estela de vuelo de propulsión -->
    <polygon points="10,35 -60,25 -60,45" fill="#facc15" opacity="0.8"/>
    <polygon points="5,35 -40,30 -40,40" fill="#f97316"/>

    <!-- Navegante / Ala Delta Pixel -->
    <polygon points="60,35 10,15 10,55" fill="#0284c7"/>
    <polygon points="55,35 15,20 15,50" fill="#38bdf8"/>
    <rect x="25" y="31" width="18" height="8" fill="#f8fafc" rx="2"/>
    <circle cx="36" cy="27" r="5" fill="#fde047"/>

    <!-- Partículas de energía de vuelo -->
    <g fill="#38bdf8">
      <rect x="-20" y="10" width="5" height="5"/>
      <rect x="-45" y="50" width="6" height="6"/>
      <rect x="-70" y="20" width="4" height="4"/>
    </g>
  </g>

  <!-- Mobs Voladores hostiles generados en vuelo -->
  <!-- Mob 1 (arriba derecha) -->
  <g transform="translate(480, 60)" fill="#f43f5e">
    <polygon points="30,20 10,5 20,20 10,35" fill="#e11d48"/>
    <polygon points="30,20 45,10 40,20 45,30" fill="#be123c"/>
    <circle cx="28" cy="18" r="3" fill="#facc15"/>
    <circle cx="28" cy="22" r="3" fill="#facc15"/>
  </g>

  <!-- Mob 2 (abajo izquierda acechando) -->
  <g transform="translate(100, 190)" fill="#a855f7">
    <polygon points="35,25 15,10 25,25 15,40" fill="#9333ea"/>
    <polygon points="35,25 50,15 45,25 50,35" fill="#7e22ce"/>
    <circle cx="33" cy="23" r="3" fill="#f43f5e"/>
    <circle cx="33" cy="27" r="3" fill="#f43f5e"/>
  </g>

  <!-- Borde inferior estilizado -->
  <rect x="0" y="270" width="640" height="90" fill="#082f49" opacity="0.95"/>
  <rect x="0" y="266" width="640" height="4" fill="#38bdf8" opacity="0.6"/>

  <text x="320" y="310" font-family="'Courier New', monospace" font-weight="900" font-size="17" fill="#38bdf8" text-anchor="middle" letter-spacing="2">
    [ AERIAL NAVIGATION &amp; MOB ENCOUNTERS ]
  </text>
  <text x="320" y="335" font-family="'Courier New', monospace" font-size="12" fill="#bae6fd" text-anchor="middle">
    MYTHICMOBS &bull; CONDITIONALEVENTS &bull; DYNAMIC AIR ENCOUNTERS
  </text>
</svg>
